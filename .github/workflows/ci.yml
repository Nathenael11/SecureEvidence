name: SecureEvidence CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
      JWT_SECRET: "ci-pipeline-jwt-secret-key-32-chars-long-2026"
      SKIP_E2E_PLAYWRIGHT: "1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify AI Threat Detection Engine Artifacts
        run: |
          python -c "from ai_engine.detector import ThreatDetector; d = ThreatDetector(); print('[OK] ThreatDetector verified with classes:', len(d.attack_classes))"

      - name: Run Automated PyTest Suite
        run: |
          pytest tests/ -v

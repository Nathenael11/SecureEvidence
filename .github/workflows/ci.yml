name: SecureEvidence CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint Python Codebase
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend/ ai_engine/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Complexity & warning checks
          flake8 backend/ ai_engine/ --count --exit-zero --max-complexity=15 --max-line-length=140 --statistics

  hardhat-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Compile and Test Hardhat Contracts
        run: npx hardhat test

  test-and-verify:
    needs: [lint-and-format, hardhat-contract-tests]
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
      JWT_SECRET: "ci-pipeline-jwt-secret-key-32-chars-long-2026"
      SKIP_E2E_PLAYWRIGHT: "1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify AI Threat Detection Engine Artifacts
        run: |
          python -c "from ai_engine.detector import ThreatDetector; d = ThreatDetector(); print('[OK] ThreatDetector verified with classes:', len(d.attack_classes))"

      - name: Run Automated PyTest Suite
        run: |
          pytest tests/ -v

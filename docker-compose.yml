version: '3.8'

services:
  hardhat-node:
    image: node:18-alpine
    container_name: insa_hardhat_node
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8545:8545"
    command: sh -c "npm install && npx hardhat node --hostname 0.0.0.0"
    restart: unless-stopped

  secure-evidence-app:
    build: .
    container_name: insa_secure_evidence
    depends_on:
      - hardhat-node
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - RPC_URL=http://hardhat-node:8545
      - CHAIN_MODE=local
      - AGENCY_NAME=INSA Ethiopia
      - AUTHOR_NAME=Nathenael Ermias
    restart: unless-stopped
